name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Build Web Assets
        env:
          VITE_TOWER_API_KEY: ${{ secrets.VITE_TOWER_API_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || (mkdir -p android/app/src/main/assets/public && cp -r dist/* android/app/src/main/assets/public/)

      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle wrapper --gradle-version 8.2.1
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        run: |
          find android/app/build/outputs/apk -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inter-Wallet-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Inter Wallet Latest Release"
          body: |
            ### Direct Downloads
            - **Android APK**: [app-debug.apk](https://github.com/Generis2001/inter/releases/latest/download/app-debug.apk)
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
