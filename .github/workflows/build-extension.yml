name: Build Chrome Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    name: Build & Package Chrome Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-package-lock

      - name: Build Web Assets (Includes Manifest V3)
        env:
          VITE_TOWER_API_KEY: ${{ secrets.VITE_TOWER_API_KEY }}
        run: npm run build

      - name: Package Chrome Extension ZIP
        run: |
          cd dist
          zip -r ../inter-chrome-extension.zip ./*

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inter-Chrome-Extension
          path: inter-chrome-extension.zip
          retention-days: 30

      - name: Attach Extension to Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          files: |
            inter-chrome-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

